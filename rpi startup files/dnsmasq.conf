# DHCP and DNS configuration for Raspberry Pi Access Point
# Copy this file to: /etc/dnsmasq.conf (backup the original first!)

# Interface to listen on
interface=wlan0

# Bind to the interface to make sure we aren't sending things elsewhere
bind-interfaces

# Never forward plain names (without a dot or domain part)
domain-needed

# Never forward addresses in the non-routed address spaces
bogus-priv

# DHCP range
# Assign IP addresses between 192.168.4.10 and 192.168.4.100
# Lease time is 24 hours
dhcp-range=192.168.4.10,192.168.4.100,255.255.255.0,24h

# If you want to provide a default gateway, uncomment:
# dhcp-option=3,192.168.4.1

# DNS server to announce (the Pi itself)
dhcp-option=6,192.168.4.1
