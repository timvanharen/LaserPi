# WiFi Access Point Configuration for Raspberry Pi
# Copy this file to: /etc/hostapd/hostapd.conf

# Interface to use for AP
interface=wlan0

# Driver interface type
driver=nl80211

# Network name (SSID)
ssid=LaserPi-Network

# WiFi channel (1-11)
channel=7

# WiFi mode (a = IEEE 802.11a, b = IEEE 802.11b, g = IEEE 802.11g)
hw_mode=g

# Country code (adjust to your country)
country_code=NL

# Enable 802.11n support
ieee80211n=1

# QoS support
wmm_enabled=1

# Use WPA2 security
wpa=2
wpa_passphrase=laserpi123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Accept all MAC addresses
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
